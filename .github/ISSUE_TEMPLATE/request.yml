name: A diagram type or feature I wish it had
description: Tell us what you tried to draw and could not
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Issues on this repository are public. Describe the kind of diagram, not your confidential system.
  - type: textarea
    id: want
    attributes:
      label: What did you want to draw, and who is it for?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What did you try, and where did it fall short?
