version: 2

models:
  - name: customers
    description: >
      One row per customer, with the first and most recent order
      and their lifetime value.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: first_name
        data_type: varchar
      - name: last_name
        data_type: varchar
      - name: first_order
        data_type: date
      - name: number_of_orders
        data_type: integer
      - name: customer_lifetime_value
        data_type: numeric

  - name: orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('customers')
              field: customer_id
      - name: order_date
        data_type: date
      - name: status
        data_type: varchar
        tests:
          - accepted_values:
              values: ['placed', 'shipped', 'completed', 'returned']
      - name: amount
        data_type: numeric
